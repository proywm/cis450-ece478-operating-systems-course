name: SystemStudio OS extension CI

on:
  push:
    branches:
      - release/**
      - fall2026-course
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemstudio-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-extension-host:
    name: Packaged Extension Host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out course repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build, test, package, and audit student VSIX
        run: npm run package:portable

      - name: Exercise packaged VSIX in Linux Extension Host
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Exercise packaged VSIX in Windows/macOS Extension Host
        if: runner.os != 'Linux'
        run: npm run test:integration

      - name: Upload audited VSIX and integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemstudio-os-${{ runner.os }}-vsix-and-integration
          path: |
            extension/systemstudio-cis450-ece478-*.vsix
            extension/integration-results/*.json
          if-no-files-found: warn
          retention-days: 14

  ubuntu-native-course-runtime:
    name: Ubuntu compiler, labs, xv6, and container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Check out course repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install native x86 and headless xv6 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-multilib qemu-system-x86

      - name: Confirm hosted Linux container runtime
        run: |
          docker version
          docker compose version

      - name: Compile and execute course starters, private fixtures, OSTEP, xv6, and container route
        env:
          SYSTEMSTUDIO_REQUIRE_DOCKER: "1"
        run: |
          mkdir -p integration-results
          npm run check:native 2>&1 | tee integration-results/ubuntu-native-course-runtime.log

      - name: Upload native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemstudio-os-ubuntu-native-runtime
          path: extension/integration-results/ubuntu-native-course-runtime.log
          if-no-files-found: warn
          retention-days: 14
